  <text x="25" y="95" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12.5" font-weight="normal">HEADER: ALGORITHM &amp; TOKEN TYPE</text><text x="25" y="116" fill="#79c0ff" font-family="Consolas, monospace" font-size="12.5" font-weight="normal">{ &quot;alg&quot;: &quot;HS256&quot;, &quot;typ&quot;: &quot;JWT&quot; }</text><text x="25" y="137" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12.5" font-weight="normal"></text><text x="25" y="158" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12.5" font-weight="normal">PAYLOAD: DATA (Only safe username, NO password)</text><text x="25" y="179" fill="#79c0ff" font-family="Consolas, monospace" font-size="12.5" font-weight="normal">{ &quot;username&quot;: &quot;israr_hussain&quot;, &quot;iat&quot;: 1731924000, &quot;exp&quot;: 1731927600 }</text><text x="25" y="200" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12.5" font-weight="normal"></text><text x="25" y="221" fill="#c9d1d9" font-family="Consolas, monospace" font-size="12.5" font-weight="normal">VERIFY SIGNATURE: HMACSHA256(base64UrlEncode(header) + '.' + base64UrlEncode(payload), SECRET_KEY)</text>
